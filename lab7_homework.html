
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content = "initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title> Colarado Soils </title>
  <link rel = "stylesheet" href = "https://js.arcgis.com/4.21/esri/themes/light/main.css"/>
  <script src = "https://js.arcgis.com/4.21/"> </script>
  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
    #titleDiv {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 10;
      background: white;
      padding: 12px 16px;
      border-radius: 7px;
      max-width: 300px;
    }
    #tileDiv h2 {
      margin: 0 0 5px;
      color: #315b42
    }
    #optionsDiv{
      position: absolute;
      top: 140px;
      left: 50px;
      z-index: 10;
      background-color: white;
      padding: 15px;
      width: 250px;
      border-radius: 7px;
    }
    #footerDiv {
      position: absolute;
      bottom: 10px;
      left: 10px;
      z-index: 10;
      background: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
    }
</style>
</head>
<body>
  <div id="viewDiv"></div>

  <div id = "titleDiv">
    <h2> Colorado Soil Explorer </h2>
    <p> Explore Soils in Colardo </p>
  </div>

  <div id="optionsDiv" class="esri-widget">
    <h3>Web Mapping Lab 7 Pages</h3>
    <label for="pageSelect">Open another lab exercise:</label>
    <select id="pageSelect">
      <option value="">Choose a page...</option>
      <option value="https://deannag890.github.io/simple_mapping">Simple Mapping</option>
      <option value="https://deannag890.github.io/tile_layer">Tile Layers</option>
      <option value="https://deannag890.github.io/dynamic_layers">Dynamic Layers</option>
      <option value="https://deannag890.github.io/on_event">View on Event</option>
      <option value="https://deannag890.github.io/basemap_gallery">Basemap Gallery</option>
      <option value="https://deannag890.github.io/query_task">Query Task</option>
    </select>
    <hr>
  <h3> Soil Map Units </h3>

    <label for="soilSelect">Choose a map unit symbol:</label>
    <select id="soilSelect">
      <option value="">Choose a soil symbol...</option>
      <option value="128">128</option>
      <option value="129">129</option>
      <option value="130">130</option>
      <option value="GR4">GR4</option>
      <option value="GR5">GR5</option>
      <option value="GR6">GR6</option>
    </select>

    <button id="searchButton">Find Soil</button>
    <button id="clearButton">Clear Highlights</button>

    <div id="printResults">
      Select a soil symbol to search the data.
   </div>
  </div>
   <div id="footerDiv">
     Soil data: USDA NRCS, gSSURGO Colorado (2023) |
     Basemap: Esri
   </div>

   <script>
     require([
     "esri/Map",
     "esri/views/MapView",
     "esri/layers/TileLayer",
     "esri/layers/GraphicsLayer",
     "esri/tasks/QueryTask",
     "esri/tasks/support/Query",
     "esri/Graphic",
     "esri/widgets/Legend"
   ], function (
     Map,
     MapView,
     TileLayer,
     GraphicsLayer,
     QueryTask,
     Query,
     Graphic,
     Legend
   ) {
     const soilMapLayer = new TileLayer ({
       url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/ColoradoSoilsTileLayer/MapServer"
     )};
     const placesLayer = new TileLayer ({
       url: "https://services.arcgisonline.com/arcgis/rest/services/Reference/World_Boundaries_and_Places/MapServer"
     });
     const resultsLayer = new GraphicsLayer ({

     });
     const map = new Map({
       basemap: "oceans",
       layers: [placesLayer, soilMapLayer, resultsLayer]
     });
     const view = new MapView({
       container: "viewDiv",
       map: map,
       center: [-105, 39]
       zoom: 5
     });
     const legend = new Legend({
       view: view
     });
     view.ui.add(legend, "top-right");
     const queryTask = new QueryTask({
       url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/ColoradoSoilsFeatureLayer/FeatureServer/0"
     });
     const soilSelect = document.getElementByID("soilSelect");
     const resultsDiv = document.getElementByID("printResults");

     document.getElementByID("pageSelect")
        .addEventListener("change", function () {
          if (this.value !== "") {
            window.open(this.value, "_blank");
          }
        });
     document.getElementByID("searchButton")
        .addEventListener("click", function () {
          const symbol = soilSelect.value;
          if (symbol === "") {
            results.Div.textContent =
            "Please choose a soil map unit symbol first.";
          return;
          }
        results.Layer.removeAll();

        const query = new Query({
          where: "MUSYM = '" + safeSymbol + "'",
          outfields: ["MUSYM", "MUKEY", "AREASYMBOL"],
          returnGeometry: true
        });

        results.Div.textContent ="Searchimg for soil polygons";
        query.Task.execute(query).then(function(response {
          const features = response.feaures;
          if (features.length === 0) {
            results.Div.textContent =
            "No polygons found for symbol " + symbol + ".";
            return;
          }
          features.forEach (function(feature) {
            const graphic = new Graphic ({
              geometry: feature.geometry,
              attributes: feature.attributes,
              symbol: {
                type: "simple-fill",
                color: [255, 220, 0, 0.45],
                outline: {
                  color: [170, 100, 0, 1],
                  width: 1.5
            }
          },
          popupTemplate: {
            title: "Soil Map Unit: {MUSYM}",
            content:
            "<b> Map unit symbol:</b> {MUSYM}<br>" +
            "<b> Map unit key: </b> {MUKEY}<br>" +
            "<b>Survey area: </b> {AREASYMBOL}"
          }
        });

        results.Layer.add(graphic);
      });
      results.Div.textContent =
        features.length +"polygon(s) found for symbol" +
        symbol + ". The map is zooming to the results.";
        view.goTo(features).catch(function(error)) {
          if (error.name !== "AbortError") {
            console.error("Navigation error:", error);
          }
        });
      }).catch(function(error) {
        console.error("Soil query failed:", error);
        results.DivtextContent =
        "The search failed. Check your internet connection" +
        "and the browser console.";
      });
    });

    document.getElementByID("clearButton")
    .addEventListener("click", function () {
      resultsLayer.removeAll();

      results.DivtextContent =
      "Highlights cleared. Choose another soil symbol.";
      view.goTo({
        center: [-105, 39],
        zoom: 5
      });
    });
  });
  </script>
</body>
</html>
